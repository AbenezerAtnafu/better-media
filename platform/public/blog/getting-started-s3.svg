<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="g1" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="rgba(16,185,129,0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="g2" cx="85%" cy="10%" r="55%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.1)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.04)"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#09090b"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- Top-left label -->
  <text x="64" y="80" font-family="monospace" font-size="13" font-weight="700" fill="rgba(255,255,255,0.25)" letter-spacing="4">TUTORIAL</text>

  <!-- Tag badge -->
  <rect x="64" y="220" width="126" height="36" rx="6" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <text x="127" y="243" font-family="monospace" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="1">S3 STORAGE</text>

  <!-- Headline -->
  <text x="64" y="320" font-family="system-ui, sans-serif" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Getting Started</text>
  <text x="64" y="390" font-family="system-ui, sans-serif" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="-1.5">with S3 Storage</text>

  <!-- Subline -->
  <text x="64" y="450" font-family="system-ui, sans-serif" font-size="22" fill="rgba(255,255,255,0.4)">Step-by-step guide including presigned URL uploads.</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="rgba(255,255,255,0.02)"/>
  <text x="64" y="616" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.2)" letter-spacing="2">BETTER MEDIA BLOG</text>
  <text x="1136" y="616" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.2)" text-anchor="end">2026</text>

  <!-- Decorative: storage cylinders -->
  <ellipse cx="1050" cy="240" rx="80" ry="22" fill="none" stroke="rgba(16,185,129,0.12)" stroke-width="1"/>
  <rect x="970" y="240" width="160" height="80" fill="none" stroke="rgba(16,185,129,0.08)" stroke-width="1"/>
  <ellipse cx="1050" cy="320" rx="80" ry="22" fill="rgba(16,185,129,0.04)" stroke="rgba(16,185,129,0.12)" stroke-width="1"/>

  <ellipse cx="1050" cy="340" rx="80" ry="22" fill="none" stroke="rgba(16,185,129,0.08)" stroke-width="1"/>
  <rect x="970" y="340" width="160" height="80" fill="none" stroke="rgba(16,185,129,0.05)" stroke-width="1"/>
  <ellipse cx="1050" cy="420" rx="80" ry="22" fill="rgba(16,185,129,0.03)" stroke="rgba(16,185,129,0.08)" stroke-width="1"/>
</svg>
